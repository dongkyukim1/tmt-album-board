<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMT 관리자</title>
<script src="./env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#0F0D0A;
    --surface:rgba(255,251,240,.035);
    --surface-solid:#18150F;
    --line:rgba(237,231,219,.08);
    --line-strong:rgba(237,231,219,.16);
    --ink:#F0EADF; --muted:#A79F90; --faint:#6F675A;
    --gold:#E3B24E; --gold-soft:rgba(227,178,78,.14);
    --taste:#2E9A72; --hmm:#B8862F; --respect:#CE5F78;
    --danger:#E5533D;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;
  }
  /* 은은한 앰비언트 글로우 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px 400px at 12% -6%, rgba(227,178,78,.07), transparent 60%),
      radial-gradient(700px 500px at 105% 110%, rgba(206,95,120,.05), transparent 60%);}
  #app{position:relative;z-index:1}
  a{color:var(--gold)}
  ::selection{background:rgba(227,178,78,.3)}

  /* ── 로그인 ───────────────────────────────────── */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:400px;background:linear-gradient(180deg,rgba(255,251,240,.05),rgba(255,251,240,.02));
    border:1px solid var(--line-strong);border-radius:24px;padding:40px 36px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(6px);
    animation:rise .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brandmark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .vinyl{width:34px;height:34px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 50% 50%, #F6F0E4 0 18%, #17130E 19% 42%, #2A241B 43% 58%, #17130E 59% 100%);
    border:1px solid var(--line-strong)}
  .brandmark b{font-size:17px;letter-spacing:-.2px}
  .brandmark b i{color:var(--respect);font-style:normal}
  .login-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:4px}
  .login-card .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line-strong);
    background:rgba(15,13,10,.6);color:var(--ink);font-size:15px;font-family:inherit;
    transition:border-color .15s, box-shadow .15s}
  .field input::placeholder{color:var(--faint)}
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,178,78,.18)}
  .btn-primary{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#EFC066,#DBA53E);color:#191307;font-size:15px;font-weight:800;
    letter-spacing:-.2px;font-family:inherit;transition:transform .12s, box-shadow .15s;
    box-shadow:0 8px 24px rgba(227,178,78,.22)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.5;transform:none;cursor:default}
  .login-note{margin-top:18px;font-size:12.5px;color:var(--faint);line-height:1.6}
  .error{margin-top:12px;font-size:13px;color:var(--danger);min-height:19px}

  /* ── 셸 ───────────────────────────────────────── */
  header.top{position:sticky;top:0;z-index:20;
    background:rgba(15,13,10,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 24px}
  .top-in .brandmark{margin:0}
  .top-in .brandmark b{font-size:15px}
  .top-in .spacer{flex:1}
  .updated{color:var(--faint);font-size:12.5px}
  .icon-btn{display:flex;align-items:center;gap:7px;background:var(--surface);color:var(--muted);
    border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .15s;font-family:inherit}
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wrap{max-width:1200px;margin:0 auto;padding:8px 24px 100px}
  section{margin-top:44px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
  h2{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:4px 0 18px}
  h2 small{font-size:13px;font-weight:500;color:var(--faint);margin-left:8px;letter-spacing:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;
    transition:border-color .2s}

  /* 스탯 타일 */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 18px 16px;transition:transform .15s, border-color .2s}
  .tile:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .tile .k{font-size:12.5px;font-weight:600;color:var(--muted)}
  .tile .v{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:4px;
    font-variant-numeric:tabular-nums}
  .tile.hot{border-color:rgba(227,178,78,.35);background:linear-gradient(180deg,var(--gold-soft),transparent)}
  .tile.hot .v{color:var(--gold)}

  /* 추이 차트 */
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .chart-card h3{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted);
    font-weight:700;margin-bottom:12px}
  .chart-card .big{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px;
    font-variant-numeric:tabular-nums}
  .chart-card .toggle{margin-left:auto;font-size:12px;font-weight:600;color:var(--faint);
    cursor:pointer;padding:3px 8px;border-radius:7px;transition:all .15s}
  .chart-card .toggle:hover{color:var(--ink);background:var(--surface)}
  .chart-box{height:150px;position:relative}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;
    font-variant-numeric:tabular-nums}
  table.data th,table.data td{padding:5px 8px;border-bottom:1px solid var(--line);
    text-align:right;color:var(--muted)}
  table.data th:first-child,table.data td:first-child{text-align:left}

  /* 취향 분포 */
  .verdict-bar{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:3px}
  .verdict-bar .seg{display:flex;align-items:center;justify-content:center;border-radius:4px;
    font-size:12px;font-weight:800;color:#14110D;min-width:0;white-space:nowrap;overflow:hidden;
    animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{flex:0 0 0%}}
  .legend{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .legend .chip{display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted)}
  .legend .dot{width:9px;height:9px;border-radius:3px}
  .legend b{color:var(--ink);font-variant-numeric:tabular-nums}
  .legend .pct{color:var(--faint);font-size:12px}

  /* 코멘트 */
  .comment{display:flex;gap:14px;padding:15px 10px;border-bottom:1px solid var(--line);
    border-radius:12px;transition:background .15s}
  .comment:hover{background:rgba(255,251,240,.025)}
  .comment:last-child{border-bottom:0}
  .cover{width:48px;height:48px;border-radius:10px;background:var(--surface-solid);
    object-fit:cover;flex:none;border:1px solid var(--line)}
  .comment .body{min-width:0;flex:1}
  .comment .album{font-size:14px;color:var(--ink);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .comment .album span{color:var(--faint);font-weight:500}
  .comment .text{font-size:14px;color:var(--muted);margin-top:3px;word-break:break-all}
  .comment .meta{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:12.5px;color:var(--faint)}
  .avatar{border-radius:50%;flex:none;display:inline-flex;
    align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#14110D}
  .tag{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;color:#14110D;letter-spacing:.02em}

  /* 공개 탑스터 */
  .grids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .grid-card{transition:transform .15s, border-color .2s}
  .grid-card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .grid-card .covers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    border-radius:12px;overflow:hidden}
  .grid-card .covers img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface-solid);display:block}
  .grid-card .t{font-size:14.5px;font-weight:700;margin-top:12px;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid-card .o{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);margin-top:4px}

  /* 사용자 테이블 */
  .table-tools{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .search{flex:1;max-width:280px;position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;
    stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round}
  .search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:13.5px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--gold)}
  .users-table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  .users-table th{color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line-strong)}
  .users-table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;color:var(--muted)}
  .users-table th:nth-child(-n+2),.users-table td:nth-child(-n+2){text-align:left}
  .users-table tbody tr{transition:background .12s}
  .users-table tbody tr:hover{background:rgba(255,251,240,.03)}
  .users-table .nick{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:9px}
  .btn-more{margin-top:16px;padding:10px 22px;background:var(--surface);color:var(--muted);
    border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:all .15s}
  .btn-more:hover{color:var(--ink);border-color:var(--line-strong)}
  .empty{color:var(--faint);font-size:13.5px;padding:22px 0;text-align:center}

  /* 로딩 */
  #loading{position:fixed;inset:0;background:rgba(15,13,10,.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-strong);
    border-top-color:var(--gold);animation:spin .8s linear infinite}
  @media (max-width:640px){ .wrap{padding:8px 16px 80px} .top-in{padding:12px 16px} }
</style>
</head>
<body>
<div id="app">

<!-- 로그인 -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="brandmark"><div class="vinyl"></div><b>Taste <i>My</i> Taste</b></div>
    <h1>관리자 대시보드</h1>
    <div class="sub">서비스 지표를 한 곳에서 봅니다</div>
    <div class="field"><label for="email">이메일</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" required></div>
    <div class="field"><label for="password">비밀번호</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
    <button class="btn-primary" id="loginBtn" type="submit">로그인</button>
    <div class="error" id="loginError"></div>
    <div class="login-note">TMT 앱 계정으로 로그인합니다.<br>관리자로 등록된 이메일만 접근할 수 있어요.</div>
  </form>
</div>

<!-- 대시보드 -->
<div id="dash" style="display:none">
  <header class="top">
    <div class="top-in">
      <div class="brandmark"><div class="vinyl"></div><b>TMT <span style="color:var(--faint);font-weight:600">Admin</span></b></div>
      <div class="spacer"></div>
      <span class="updated" id="updatedAt"></span>
      <button class="icon-btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 3v6h-6"/></svg>새로고침</button>
      <button class="icon-btn" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>로그아웃</button>
    </div>
  </header>

  <div class="wrap">
    <section>
      <div class="eyebrow">Overview</div>
      <h2>한눈에 보기</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section>
      <div class="eyebrow">Trends</div>
      <h2>최근 30일 추이 <small>기준 Asia/Seoul (한국시간)</small></h2>
      <div class="charts" id="charts"></div>
    </section>

    <section>
      <div class="eyebrow">Taste</div>
      <h2>취향 분포 <small>유저×앨범 최신 평가 기준</small></h2>
      <div class="card">
        <div class="verdict-bar" id="verdictBar"></div>
        <div class="legend" id="verdictLegend"></div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Comments</div>
      <h2>최근 코멘트</h2>
      <div class="card" id="comments" style="padding:8px 12px"></div>
    </section>

    <section>
      <div class="eyebrow">Topsters</div>
      <h2>최근 공개 탑스터</h2>
      <div class="grids" id="publicCharts"></div>
    </section>

    <section>
      <div class="eyebrow">Users</div>
      <h2>사용자</h2>
      <div class="card" style="overflow-x:auto">
        <div class="table-tools">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="userFilter" type="search" placeholder="닉네임·이메일 필터">
          </div>
        </div>
        <table class="users-table">
          <thead><tr>
            <th>닉네임</th><th>이메일</th><th>가입일</th>
            <th>평가</th><th>코멘트</th><th>위시</th><th>탑스터</th>
          </tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
        <button class="btn-more" id="moreUsers" type="button" style="display:none">더 보기</button>
      </div>
    </section>
  </div>
</div>

<div id="loading"><div class="spinner"></div></div>
</div>

<script>
// API base: ?api= 오버라이드(로컬 테스트) → env.js → 운영 폴백.
const API =
  new URLSearchParams(location.search).get('api') ||
  (window.__ENV__ && window.__ENV__.API_BASE_URL) ||
  'https://music-api-o7d8.onrender.com/api/v1';
const PALETTE = { taste:'#2E9A72', hmm:'#B8862F', respect:'#CE5F78', gold:'#E3B24E' };
const VERDICT_META = {
  like:    { label:'TASTE! (내 취향)',   color:PALETTE.taste },
  unknown: { label:'HMM.. (애매)',       color:PALETTE.hmm },
  dislike: { label:'RESPECT (취향 존중)', color:PALETTE.respect },
};

// ── 인증 ────────────────────────────────────────────
const store = {
  get access(){ return sessionStorage.getItem('tmt_at'); },
  get refresh(){ return sessionStorage.getItem('tmt_rt'); },
  save(a, r){ sessionStorage.setItem('tmt_at', a); if (r) sessionStorage.setItem('tmt_rt', r); },
  clear(){ sessionStorage.removeItem('tmt_at'); sessionStorage.removeItem('tmt_rt'); },
};

async function api(path, opts = {}, retried = false) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(store.access ? { Authorization: 'Bearer ' + store.access } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401 && !retried && store.refresh) {
    const ok = await tryRefresh();
    if (ok) return api(path, opts, true);
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body?.error?.message || '요청에 실패했습니다');
    err.code = body?.error?.code || res.status;
    throw err;
  }
  return body;
}

async function tryRefresh() {
  try {
    const res = await fetch(API + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: store.refresh }),
    });
    if (!res.ok) return false;
    const body = await res.json();
    const d = body?.data || {};
    if (!d.accessToken) return false;
    store.save(d.accessToken, d.refreshToken);
    return true;
  } catch { return false; }
}

// ── 로그인 ──────────────────────────────────────────
const $ = (id) => document.getElementById(id);

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginError').textContent = '';
  try {
    const body = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
    });
    const d = body.data || {};
    store.save(d.accessToken, d.refreshToken);
    await enterDash();
  } catch (err) {
    $('loginError').textContent =
      err.code === 'invalid_credentials' ? '이메일 또는 비밀번호가 올바르지 않습니다'
      : err.message;
  } finally {
    $('loginBtn').disabled = false;
  }
});

$('logoutBtn').addEventListener('click', () => { store.clear(); location.reload(); });
$('refreshBtn').addEventListener('click', () => loadAll());

// ── 유틸 ───────────────────────────────────────────
const nf = new Intl.NumberFormat('ko-KR');
const fmtDate = (s) => { const d = new Date(s);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const rel = (s) => {
  const diff = (Date.now() - new Date(s).getTime()) / 1000;
  if (diff < 3600) return `${Math.max(1, Math.floor(diff/60))}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  return `${Math.floor(diff/86400)}일 전`;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 닉네임 → 아바타(이니셜 + 결정적 색상). */
const AVATAR_COLORS = [PALETTE.taste, PALETTE.hmm, PALETTE.respect, '#7A8FC9', '#B07FC9'];
function avatarHtml(name, size = 20) {
  const n = String(name || '?');
  let h = 0;
  for (const ch of n) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const color = AVATAR_COLORS[h % AVATAR_COLORS.length];
  return `<span class="avatar" style="width:${size}px;height:${size}px;background:${color}">${esc([...n][0].toUpperCase())}</span>`;
}

// 앨범 자켓 일괄 조회(50개 청크) — collectionId → artworkUrl
async function fetchArtworks(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  const map = {};
  for (let i = 0; i < uniq.length; i += 50) {
    const chunk = uniq.slice(i, i + 50);
    try {
      const body = await api('/itunes/lookup?id=' + chunk.join(','));
      for (const r of body?.data?.results || []) {
        if (r.wrapperType !== 'collection' || !r.artworkUrl100) continue;
        map[String(r.collectionId)] = {
          art: r.artworkUrl100.replace('100x100bb', '300x300bb'),
          title: r.collectionName, artist: r.artistName,
        };
      }
    } catch { /* 청크 실패는 건너뜀 */ }
  }
  return map;
}

// ── 대시보드 로드 ────────────────────────────────────
let usersCursor = null;
const chartInstances = [];

async function enterDash() {
  try {
    await loadAll();
    $('login').style.display = 'none';
    $('dash').style.display = 'block';
  } catch (err) {
    store.clear();
    $('loginError').textContent =
      err.code === 'forbidden' ? '관리자 권한이 없는 계정입니다' : err.message;
    throw err;
  }
}

async function loadAll() {
  $('loading').style.display = 'flex';
  $('refreshBtn').classList.add('spin');
  try {
    const [overview, users, comments, charts] = await Promise.all([
      api('/admin/overview'),
      api('/admin/users?limit=20'),
      api('/admin/comments?limit=15'),
      api('/admin/charts?limit=8'),
    ]);
    renderTiles(overview.data);
    renderTrends(overview.data);
    renderVerdicts(overview.data.verdictBreakdown || {});
    renderUsers(users, true);
    await Promise.all([renderComments(comments.data || []), renderCharts(charts.data || [])]);
    $('updatedAt').textContent = new Date().toLocaleTimeString('ko-KR') + ' 기준';
  } finally {
    $('loading').style.display = 'none';
    $('refreshBtn').classList.remove('spin');
  }
}

function renderTiles(d) {
  const t = d.totals || {};
  // 오늘 가입 = 가입 추이의 마지막 날(서버 기준일) 값.
  const signups = d.signupsDaily || [];
  const todaySignups = signups.length ? signups[signups.length - 1].count : 0;
  const tiles = [
    ['총 사용자', t.users], ['오늘 가입', todaySignups, todaySignups > 0],
    ['총 평가 수', t.swipes], ['평가된 앨범', t.ratedAlbums],
    ['코멘트', t.comments], ['위시리스트', t.wishlistItems],
    ['탑스터(공개/전체)',
      `${nf.format(t.publicCharts ?? 0)} / ${nf.format(t.charts ?? 0)}`],
  ];
  $('tiles').innerHTML = tiles.map(([k, v, hot]) => `
    <div class="tile${hot ? ' hot' : ''}">
      <div class="k">${k}</div>
      <div class="v">${typeof v === 'number' ? nf.format(v) : (v ?? '-')}</div>
    </div>`).join('');
}

function renderTrends(d) {
  chartInstances.forEach((c) => c.destroy());
  chartInstances.length = 0;
  const defs = [
    ['새 가입', d.signupsDaily || [], PALETTE.gold],
    ['평가(스와이프)', d.swipesDaily || [], PALETTE.taste],
    ['리뷰·코멘트', d.reviewsDaily || [], PALETTE.respect],
  ];
  $('charts').innerHTML = defs.map(([title, rows, _], i) => {
    const total = (rows || []).reduce((s, r) => s + r.count, 0);
    const tid = `tbl${i}`;
    return `<div class="card chart-card">
      <h3>${title}<span class="big">${nf.format(total)}</span>
        <span class="toggle" data-t="${tid}">표 보기</span></h3>
      <div class="chart-box"><canvas id="c${i}"></canvas></div>
      <div id="${tid}" style="display:none;max-height:180px;overflow:auto">
        <table class="data"><tr><th>날짜</th><th>건수</th></tr>
        ${(rows || []).map((r) => `<tr><td>${r.date}</td><td>${r.count}</td></tr>`).join('')}
        </table></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.toggle').forEach((el) =>
    el.addEventListener('click', () => {
      const t = $(el.dataset.t);
      const open = t.style.display !== 'none';
      t.style.display = open ? 'none' : 'block';
      el.textContent = open ? '표 보기' : '표 닫기';
    }));

  defs.forEach(([_, rows, color], i) => {
    const canvas = $(`c${i}`);
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 150);
    grad.addColorStop(0, color + '38');
    grad.addColorStop(1, color + '00');
    const labels = (rows || []).map((r) => r.date.slice(5).replace('-', '/'));
    const data = (rows || []).map((r) => r.count);
    const last = data.length - 1;
    chartInstances.push(new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data,
        borderColor: color, borderWidth: 2,
        pointRadius: (c) => (c.dataIndex === last ? 3.5 : 0),
        pointBackgroundColor: color,
        pointHoverRadius: 5, pointHoverBackgroundColor: color,
        fill: true, backgroundColor: grad, tension: 0.3,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: {
          backgroundColor: '#221D16', borderColor: 'rgba(237,231,219,.15)', borderWidth: 1,
          titleColor: '#F0EADF', bodyColor: '#A79F90', displayColors: false,
          padding: 10, cornerRadius: 8,
        }},
        scales: {
          x: { grid: { display: false }, border: { color: 'rgba(237,231,219,.12)' },
               ticks: { color: '#6F675A', maxTicksLimit: 6, font: { size: 10 } } },
          y: { beginAtZero: true, grid: { color: 'rgba(237,231,219,.05)' }, border: { display: false },
               ticks: { color: '#6F675A', maxTicksLimit: 4, precision: 0, font: { size: 10 } } },
        },
      },
    }));
  });
}

function renderVerdicts(b) {
  const total = (b.like || 0) + (b.unknown || 0) + (b.dislike || 0);
  if (!total) { $('verdictBar').innerHTML = '<div class="empty" style="flex:1">아직 평가가 없습니다</div>';
    $('verdictLegend').innerHTML = ''; return; }
  $('verdictBar').innerHTML = Object.entries(VERDICT_META).map(([k, m]) => {
    const v = b[k] || 0; if (!v) return '';
    const pct = Math.round((v / total) * 100);
    return `<div class="seg" style="background:${m.color};flex:${v}" title="${m.label} ${nf.format(v)}건">
      ${pct >= 8 ? pct + '%' : ''}</div>`;
  }).join('');
  $('verdictLegend').innerHTML = Object.entries(VERDICT_META).map(([k, m]) => {
    const v = b[k] || 0;
    const pct = total ? Math.round((v / total) * 100) : 0;
    return `<span class="chip"><span class="dot" style="background:${m.color}"></span>
      ${m.label} <b>${nf.format(v)}</b> <span class="pct">${pct}%</span></span>`;
  }).join('');
}

async function renderComments(list) {
  if (!list.length) { $('comments').innerHTML = '<div class="empty">아직 코멘트가 없습니다</div>'; return; }
  const art = await fetchArtworks(list.map((c) => c.albumId));
  const tag = (s) => s >= 4
    ? `<span class="tag" style="background:${PALETTE.taste}">TASTE!</span>`
    : s >= 2 ? `<span class="tag" style="background:${PALETTE.hmm}">HMM..</span>`
    : `<span class="tag" style="background:${PALETTE.respect}">RESPECT</span>`;
  $('comments').innerHTML = list.map((c) => {
    const a = art[String(c.albumId)] || {};
    const nick = c.user?.nickname || '익명';
    return `<div class="comment">
      ${a.art ? `<img class="cover" src="${a.art}" alt="" loading="lazy">` : '<div class="cover"></div>'}
      <div class="body">
        <div class="album">${esc(a.title || '앨범 ' + c.albumId)}
          <span> — ${esc(a.artist || '')}</span></div>
        <div class="text">${esc(c.text)}</div>
        <div class="meta">${tag(c.stars)} ${avatarHtml(nick)} <span>${esc(nick)}</span>
          <span>·</span><span>${rel(c.createdAt)}</span></div>
      </div></div>`;
  }).join('');
}

async function renderCharts(list) {
  if (!list.length) { $('publicCharts').innerHTML = '<div class="card empty" style="grid-column:1/-1">공개된 탑스터가 없습니다</div>'; return; }
  const art = await fetchArtworks(list.flatMap((c) => (c.albumIds || []).slice(0, 4)));
  $('publicCharts').innerHTML = list.map((c) => {
    const nick = c.owner?.nickname || '익명';
    return `<div class="card grid-card">
      <div class="covers">${(c.albumIds || []).slice(0, 4).map((id) => {
        const a = art[String(id)];
        return a ? `<img src="${a.art}" alt="" loading="lazy">` : '<img alt="">';
      }).join('')}</div>
      <div class="t">${esc(c.title)}</div>
      <div class="o">${avatarHtml(nick, 18)} ${esc(nick)} · ${fmtDate(c.updatedAt)}</div>
    </div>`;
  }).join('');
}

function renderUsers(body, reset) {
  const rows = body.data || [];
  usersCursor = body.hasMore ? body.nextCursor : null;
  if (reset) $('usersBody').innerHTML = '';
  $('usersBody').insertAdjacentHTML('beforeend', rows.map(userRow).join(''));
  $('moreUsers').style.display = usersCursor ? 'inline-block' : 'none';
  applyUserFilter();
}

function userRow(u) {
  return `
    <tr data-search="${esc((u.nickname + ' ' + (u.email || '')).toLowerCase())}">
      <td><span class="nick">${avatarHtml(u.nickname, 24)} ${esc(u.nickname)}</span></td>
      <td>${esc(u.email || '-')}</td>
      <td>${fmtDate(u.createdAt)}</td>
      <td>${nf.format(u.counts?.swipes ?? 0)}</td><td>${nf.format(u.counts?.comments ?? 0)}</td>
      <td>${nf.format(u.counts?.wishlist ?? 0)}</td><td>${nf.format(u.counts?.charts ?? 0)}</td></tr>`;
}

function applyUserFilter() {
  const q = $('userFilter').value.trim().toLowerCase();
  document.querySelectorAll('#usersBody tr').forEach((tr) => {
    tr.style.display = !q || tr.dataset.search.includes(q) ? '' : 'none';
  });
}
$('userFilter').addEventListener('input', applyUserFilter);

$('moreUsers').addEventListener('click', async () => {
  const body = await api('/admin/users?limit=20&cursor=' + encodeURIComponent(usersCursor));
  renderUsers(body, false);
});

// 세션이 남아 있으면 바로 대시보드 진입 시도.
if (store.access) enterDash().catch(() => { $('login').style.display = 'flex'; });
</script>
</body>
